name: ClickStudio live ClickHouse browser soak

on:
  workflow_dispatch:
  schedule:
    - cron: "31 4 * * 0"
  push:
    paths:
      - "clickstudio/tests/e2e/live-clickhouse-soak.spec.ts"
      - "clickstudio/scripts/probe-wide-clickhouse-result.mjs"
      - "clickstudio/playwright.live-clickhouse.config.ts"
      - "clickstudio/playwright.config.ts"
      - "clickstudio/src/backend/database/clickhouse/**"
      - "clickstudio/docker/clickstudio-reader.xml"
      - "clickstudio/src/backend/queries/execution/**"
      - "clickstudio/src/shared/queries/execution/**"
      - "clickstudio/src/frontend/queries/results/**"
      - "clickstudio/src/frontend/queries/execution/**"
      - "clickstudio/src/frontend/api/**"
      - "clickstudio/tsconfig.e2e.json"
      - "clickstudio/package.json"
      - "clickstudio/package-lock.json"
      - ".github/workflows/clickstudio-live-soak.yml"
  pull_request:
    paths:
      - "clickstudio/tests/e2e/live-clickhouse-soak.spec.ts"
      - "clickstudio/scripts/probe-wide-clickhouse-result.mjs"
      - "clickstudio/playwright.live-clickhouse.config.ts"
      - "clickstudio/playwright.config.ts"
      - "clickstudio/src/backend/database/clickhouse/**"
      - "clickstudio/docker/clickstudio-reader.xml"
      - "clickstudio/src/backend/queries/execution/**"
      - "clickstudio/src/shared/queries/execution/**"
      - "clickstudio/src/frontend/queries/results/**"
      - "clickstudio/src/frontend/queries/execution/**"
      - "clickstudio/src/frontend/api/**"
      - "clickstudio/tsconfig.e2e.json"
      - "clickstudio/package.json"
      - "clickstudio/package-lock.json"
      - ".github/workflows/clickstudio-live-soak.yml"

permissions:
  contents: read

concurrency:
  group: clickstudio-live-soak-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: clickstudio

jobs:
  live-clickhouse-browser:
    name: Real ClickHouse and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLICKHOUSE_INTEGRATION: "1"
      LIVE_BROWSER_SOAK_CYCLES: ${{ github.event_name == 'schedule' && '8' || '4' }}
      CLICKHOUSE_EXPECTED_VERSION: "26.9.22.3"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check live soak formatting
        run: |
          if ! npx prettier --check 'tests/e2e/live-clickhouse-soak.spec.ts' 'playwright.live-clickhouse.config.ts' 'scripts/probe-wide-clickhouse-result.mjs'; then
            npx prettier --write 'tests/e2e/live-clickhouse-soak.spec.ts' 'playwright.live-clickhouse.config.ts' 'scripts/probe-wide-clickhouse-result.mjs'
            git diff -- tests/e2e/live-clickhouse-soak.spec.ts playwright.live-clickhouse.config.ts scripts/probe-wide-clickhouse-result.mjs
            exit 1
          fi
      - name: Typecheck live browser test
        run: npx tsc --noEmit -p tsconfig.e2e.json
      - name: ESLint browser soak tests
        run: npx eslint 'tests/e2e/live-clickhouse-soak.spec.ts' 'tests/e2e/large-results-soak.spec.ts' --max-warnings=0
      - name: Start real ClickHouse 26.9.22.3
        id: database
        run: |
          npm run init:env
          docker compose up -d --wait clickhouse
          npm run db:setup
      - name: Inspect raw wide-result stream
        run: node --env-file-if-exists=.env scripts/probe-wide-clickhouse-result.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Exercise live million-row SQL and streamed export
        run: npm run test:e2e:live-soak
      - name: Capture database diagnostics on failure
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        run: docker compose logs --no-color --tail=150 > live-soak-docker.log 2>&1 || true
      - name: Preserve live browser results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-live-clickhouse-soak
          path: |
            clickstudio/benchmarks/results/browser-live-clickhouse.json
            clickstudio/playwright-report
            clickstudio/test-results
            clickstudio/live-soak-docker.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local ClickHouse
        if: ${{ always() && steps.database.outcome != 'skipped' }}
        run: docker compose down -v || true
